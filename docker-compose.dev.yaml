version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: npm run dev
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=db
      - DB_NAME=${POSTGRES_DB}
      - DB_PORT=5432
      - NODE_ENV=development
    ports:
      - "3002:3000"
    depends_on:
      - db
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - dev_pg_data:/var/lib/postgresql/data
      - ./src/data/queries.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  dev_pg_data:
